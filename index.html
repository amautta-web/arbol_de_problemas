<style>
:root{
  --ink:#16221f;
  --ink-soft:#4d5c57;
  --ink-faint:#8b9a94;
  --paper:#e9ebe4;
  --surface:#f7f8f4;
  --rule:rgba(22,34,31,.14);
  --accent:#8e2a2b;
  --accent-wash:#f3e7e4;
  --trace:#b8862f;
  --gap:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;text-align:center;
  background-image:linear-gradient(rgba(22,34,31,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(22,34,31,.035) 1px,transparent 1px);
  background-size:32px 32px;
}
.wrap{max-width:1560px;margin:0 auto;padding:44px 22px 60px}

/* ---------- títulos ---------- */
header{margin-bottom:30px}
h1{
  font-family:"Newsreader",Georgia,serif;font-weight:300;letter-spacing:-.012em;
  margin:0 auto;line-height:1.08
}
h1.eyebrow-title{font-size:clamp(19px,2.3vw,28px);color:var(--ink-soft);max-width:24ch}
h1.main-title{font-size:clamp(29px,4.3vw,52px);max-width:21ch}
h1.main-title em{font-style:italic;color:var(--accent)}
.date-line{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-faint);margin:18px 0 0;font-weight:400
}
header hr{
  border:0;height:1px;background:var(--rule);width:132px;margin:20px auto
}

/* ---------- tablero ---------- */
.board{overflow-x:auto;padding-bottom:10px}
.board-inner{min-width:1340px;position:relative}
.tier-head{display:flex;align-items:center;gap:14px;margin:22px 0 10px}
.tier-head .rule{flex:1;height:1px;background:var(--rule)}
.tier-name{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink-soft);white-space:nowrap
}
.tier-name b{color:var(--accent);font-weight:400;margin-right:9px}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:var(--gap);align-items:stretch}
.cell{display:flex;flex-direction:column}

.link{height:22px;display:flex;justify-content:center;flex-shrink:0}
.link i{width:1px;background:var(--rule);display:block;height:100%;transform-origin:top center}

/* ---------- tarjetas ---------- */
.card{
  position:relative;flex:1;width:100%;text-align:center;
  background:var(--surface);border:1px solid var(--rule);border-radius:3px;
  padding:15px 13px 14px;cursor:pointer;font:inherit;color:inherit;
  transition:border-color .25s,box-shadow .25s,transform .25s,opacity .4s,background .3s
}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--hue);opacity:.8}
.card:hover{border-color:var(--ink-faint);box-shadow:0 8px 22px -14px rgba(22,34,31,.5);transform:translateY(-2px)}
.card:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.card .code{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;
  color:var(--accent);display:block;margin-bottom:7px
}
.card .txt{
  font-size:13.1px;line-height:1.42;display:-webkit-box;-webkit-line-clamp:8;
  -webkit-box-orient:vertical;overflow:hidden
}
.card.direct{background:var(--accent-wash)}
.card.direct .txt{font-size:13.5px;font-weight:500}
.card.mute{opacity:.15}
.card.mute:hover{transform:none;box-shadow:none;border-color:var(--rule)}
.card.on{border-color:var(--ink);box-shadow:0 14px 34px -18px rgba(22,34,31,.75);z-index:4}
.card.on .txt{-webkit-line-clamp:unset;overflow:visible}
.card.on::after{
  content:"";position:absolute;inset:-5px;border:1px solid var(--trace);border-radius:5px;
  opacity:0;pointer-events:none
}

/* ---------- tronco ---------- */
.trunk{
  position:relative;margin:26px 0;padding:30px 34px;border-radius:4px;
  background:var(--ink);color:var(--surface);overflow:hidden;transition:opacity .45s
}
.trunk::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 190% at 50% 0%,rgba(184,134,47,.26),transparent 64%)
}
.trunk .tag{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--trace);margin-bottom:14px;display:flex;align-items:center;gap:14px;justify-content:center
}
.trunk .tag .bar{height:1px;width:130px;background:rgba(184,134,47,.4);transform-origin:center}
.trunk p{
  margin:0 auto;font-family:"Newsreader",Georgia,serif;font-weight:300;
  font-size:clamp(20px,2.5vw,31px);line-height:1.26;max-width:40ch;position:relative;z-index:2
}
.trunk.faded{opacity:.34}

/* ---------- trazo ---------- */
svg.trace{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;overflow:visible}
svg.trace path{fill:none;stroke:var(--trace);stroke-width:1.6;stroke-linecap:round}
svg.trace circle{fill:var(--trace)}

/* ---------- cerrar trazado ---------- */
.closer{
  position:absolute;z-index:6;width:26px;height:26px;border-radius:50%;
  border:1px solid var(--trace);background:var(--surface);color:var(--trace);
  cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;
  font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1;
  box-shadow:0 6px 16px -8px rgba(22,34,31,.6);transition:background .2s,color .2s
}
.closer:hover{background:var(--trace);color:var(--surface)}
.closer:focus-visible{outline:2px solid var(--ink);outline-offset:2px}


/* ---------- pestañas de vista ---------- */
.views{display:flex;gap:30px;justify-content:center;align-items:center;margin:0 auto 4px;position:relative;width:max-content}
.views button{
  border:0;background:none;cursor:pointer;font:inherit;padding:0 2px 12px;color:var(--ink-faint);
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.17em;text-transform:uppercase;
  transition:color .3s;font-weight:500
}
.views button[aria-selected="true"]{color:var(--ink)}
.views .vline{position:absolute;bottom:0;left:0;height:2px;background:var(--accent)}
.views::after{content:"";position:absolute;bottom:0;left:-40px;right:-40px;height:1px;background:var(--rule);z-index:-1}

/* ---------- cadena de valor ---------- */
#chainview{display:none;position:relative}
.cvhead{
  display:grid;grid-template-columns:repeat(5,1fr);gap:var(--gap);margin:30px 0 2px;
  padding:0 0 10px
}
.cvhead div{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink-faint);border-bottom:1px solid var(--rule);padding-bottom:9px;text-align:center
}
.cvhead div b{display:block;color:var(--accent);font-weight:400;margin-bottom:4px;font-size:10px}
.cveje{border-top:1px solid var(--rule);padding:30px 0 26px;transition:opacity .4s}
.cveje:first-of-type{border-top:0}
.cveje.mute{opacity:.13}
.cvtop{margin-bottom:6px}
.cvnum{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.18em;
  color:var(--hue);display:block;margin-bottom:6px
}
.cvname{
  font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink);display:block
}
.cvobj{
  font-family:"Newsreader",Georgia,serif;font-weight:300;font-size:clamp(15px,1.45vw,19.5px);
  line-height:1.42;max-width:82ch;margin:14px auto 24px;color:var(--ink-soft)
}
.cvflow{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--gap);align-items:stretch;position:relative}
.cvbox{
  position:relative;background:var(--surface);border:1px solid var(--rule);border-radius:3px;
  padding:15px 14px 14px;text-align:center;cursor:pointer;font:inherit;color:inherit;width:100%;
  transition:border-color .25s,box-shadow .25s,transform .25s,opacity .4s
}
.cvbox::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--hue);opacity:.8}
.cvbox:hover{border-color:var(--ink-faint);box-shadow:0 8px 22px -14px rgba(22,34,31,.5);transform:translateY(-2px)}
.cvbox:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.cvbox .st{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-faint);display:block;margin-bottom:9px
}
.cvbox ul{margin:0;padding:0;list-style:none;font-size:12.5px;line-height:1.45;text-align:center}
.cvbox li{margin-bottom:9px;position:relative}
.cvbox li+li{padding-top:9px}
.cvbox li+li::before{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:16px;height:1px;background:var(--hue);opacity:.3
}
.cvbox p{margin:0;font-size:12.9px;line-height:1.48;text-align:center}
.cvbox.outcome{background:var(--accent-wash)}
.cvbox.mute{opacity:.14}
.cvbox.mute:hover{transform:none;box-shadow:none;border-color:var(--rule)}
.cvbox.on{border-color:var(--ink);box-shadow:0 14px 34px -18px rgba(22,34,31,.75);z-index:4}
.cvgen{
  background:var(--ink);color:var(--surface);border-radius:4px;padding:30px 34px;margin:26px 0 4px;
  position:relative;overflow:hidden;transition:opacity .4s
}
.cvgen::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 190% at 50% 0%,rgba(184,134,47,.24),transparent 64%)}
.cvgen .tag{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--trace);margin-bottom:13px;display:flex;gap:14px;align-items:center;justify-content:center
}
.cvgen .tag .bar{height:1px;width:110px;background:rgba(184,134,47,.4)}
.cvgen p{margin:0 auto;font-family:"Newsreader",Georgia,serif;font-weight:300;
  font-size:clamp(18px,2.2vw,27px);line-height:1.3;max-width:44ch;position:relative;z-index:2}
.cvgen.mute{opacity:.3}
@media (max-width:1000px){
  .cvhead{display:none}
  .cvflow{grid-template-columns:1fr}
}

footer{
  margin-top:40px;padding-top:18px;border-top:1px solid var(--rule);
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-faint)
}

@media (max-width:760px){ .wrap{padding:30px 14px 40px} .trunk{padding:22px 18px} }
@media print{
  body{background:#fff}
  .board{overflow:visible}
  .card,.cveje,.cvbox{break-inside:avoid}
  svg.trace,.views,.closer{display:none!important}
  #chainview{display:block!important}
}
@media (prefers-reduced-motion:reduce){ *{transition-duration:.01ms!important} }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1 class="eyebrow-title">Política Pública de Envejecimiento y Vejez</h1>
    <hr>
    <h1 class="main-title">Árbol de <em>problemas</em> del envejecimiento y la vejez</h1>
    <p class="date-line">Julio 2026</p>
  </header>

  <div class="views" role="tablist" id="views">
    <span class="vline" id="vline"></span>
    <button role="tab" data-view="tree" aria-selected="true">Árbol de problemas</button>
    <button role="tab" data-view="chain" aria-selected="false">Cadena de valor</button>
  </div>

  <div id="treeview">
    <div class="board"><div class="board-inner" id="board"></div></div>
  </div>

  <div id="chainview">
    <div class="board"><div class="board-inner" id="cvinner"></div></div>
  </div>

  <noscript>
    <p style="max-width:60ch;margin:40px auto;color:#4d5c57">
      Esta visualización necesita JavaScript activado para construir el árbol.
    </p>
  </noscript>

  <footer>Actualización PPEV · Medellín · Árbol de problemas y cadena de valor · 6 ejes</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* ============ DATOS ============ */
const EJES = [
  {n:1, c:"1",          hue:"#8a6d1f", name:"Autonomía económica"},
  {n:2, c:"2 / span 2", hue:"#2f5f6e", name:"Participación comunitaria"},
  {n:3, c:"4",          hue:"#7b3550", name:"Prevención de violencias"},
  {n:4, c:"5",          hue:"#3b6b3e", name:"Salud y cuidado en la vejez"},
  {n:5, c:"6",          hue:"#5a4a7a", name:"Envejecimiento saludable"},
  {n:6, c:"7 / span 2", hue:"#8a5228", name:"Gestión del conocimiento"}
];
const CENTER = "Persistencia de brechas de protección, económicas y de cuidado que disminuyen el envejecimiento digno y saludable de las personas mayores en Medellín.";

const TIERS = [
  {id:"i-up", num:"05", name:"Efectos indirectos"},
  {id:"d-up", num:"04", name:"Efectos directos"},
  {id:"d-dn", num:"02", name:"Causas directas"},
  {id:"i-dn", num:"01", name:"Causas indirectas"}
];

const NODES = [
/* efectos indirectos */
{t:"i-up",e:1,c:"1",code:"E.I.1.1",
 x:"Incremento de la pobreza y las desigualdades en las personas mayores."},
{t:"i-up",e:2,c:"2",code:"E.I.2.1",
 x:"Falta de reconocimiento del aporte de las personas mayores en los espacios de participación, que aumenta su aislamiento social, genera deterioro de la salud mental y cognitiva y conlleva la pérdida de capital social al desaprovechar su experiencia y conocimientos."},
{t:"i-up",e:2,c:"3",code:"E.I.2.2",
 x:"Limitado ejercicio efectivo de los derechos a la participación, el reconocimiento y la incidencia social de las personas mayores."},
{t:"i-up",e:3,c:"4",code:"E.I.3.1",
 x:"Revictimización, normalización, fragmentación institucional y subregistro de las violencias contra las personas mayores."},
{t:"i-up",e:4,c:"5",code:"E.I.4.1",
 x:"Incremento de la demanda y la presión sobre los sistemas de salud, cuidado y protección social; aumento de desigualdades y sobrecarga en las familias y redes de apoyo."},
{t:"i-up",e:5,c:"6",code:"E.I.5.1",
 x:"Incremento de la soledad no deseada y deterioro de la salud mental. Sobrecarga física, emocional y económica en las familias y redes de apoyo y cuidado."},
{t:"i-up",e:6,c:"7",code:"E.I.6.1",
 x:"Poco conocimiento y formación para responder a los retos del envejecimiento y la vejez."},
{t:"i-up",e:6,c:"8",code:"E.I.6.2",
 x:"Exclusión de espacios productivos, laborales y comunitarios; limitación en el acceso a servicios de salud, aislamiento social y restricción de sus derechos."},

/* efectos directos */
{t:"d-up",e:1,c:"1",code:"E.D.1",
 x:"Carencia de recursos para el acceso a bienes, servicios y condiciones básicas para una vida digna. Pérdida de autonomía y dignidad."},
{t:"d-up",e:2,c:"2 / span 2",code:"E.D.2",
 x:"Debilitamiento de la integración social de las personas mayores en la toma de decisiones y en los escenarios de participación."},
{t:"d-up",e:3,c:"4",code:"E.D.3",
 x:"Incremento de las violencias física, psicológica y económica, y aumento de las situaciones de abandono en la vejez."},
{t:"d-up",e:4,c:"5",code:"E.D.4",
 x:"Deterioro de las condiciones de salud, incremento de las necesidades de cuidado y pérdida de independencia de las personas mayores."},
{t:"d-up",e:5,c:"6",code:"E.D.5",
 x:"Baja adopción y sostenibilidad de prácticas y hábitos de vida saludables en el envejecimiento y la vejez."},
{t:"d-up",e:6,c:"7",code:"E.D.6.1",
 x:"Insuficiente formación de profesionales capacitados e investigación especializada en envejecimiento y vejez."},
{t:"d-up",e:6,c:"8",code:"E.D.6.2",
 x:"Brecha digital y limitada inclusión de las personas mayores en entornos digitales y tecnológicos; aumento de la exclusión digital."},

/* causas directas */
{t:"d-dn",e:1,c:"1",code:"C.D.1",
 x:"Limitado acceso a oportunidades económicas y productivas en la vejez."},
{t:"d-dn",e:2,c:"2 / span 2",code:"C.D.2",
 x:"Baja incidencia en la participación social, comunitaria y ciudadana en la vejez."},
{t:"d-dn",e:3,c:"4",code:"C.D.3",
 x:"Deterioro de las relaciones familiares y limitadas redes de apoyo, que derivan en violencias sociofamiliares e institucionales contra las personas mayores."},
{t:"d-dn",e:4,c:"5",code:"C.D.4",
 x:"Insuficientes acciones de promoción de la salud, prevención de la enfermedad y corresponsabilidad en el cuidado de las personas mayores."},
{t:"d-dn",e:5,c:"6",code:"C.D.5",
 x:"Baja efectividad de las intervenciones dirigidas a promover el envejecimiento saludable y a fortalecer la autonomía de las personas mayores."},
{t:"d-dn",e:6,c:"7 / span 2",code:"C.D.6",
 x:"Limitada oferta y desarrollo de capacidades en formación, investigación y gestión del conocimiento sobre el envejecimiento y la vejez."},

/* causas indirectas */
{t:"i-dn",e:1,c:"1",code:"C.I.1.1",
 x:"Desigualdades socioeconómicas acumuladas a lo largo del curso de vida y brechas de inequidad entre lo urbano y lo rural."},
{t:"i-dn",e:2,c:"2",code:"C.I.2.1",
 x:"Débil articulación de los mecanismos e instancias de participación de las personas mayores."},
{t:"i-dn",e:2,c:"3",code:"C.I.2.2",
 x:"Prácticas, estereotipos y prejuicios edadistas en los ámbitos institucional, comunitario y cultural, que deslegitiman la voz de las personas mayores y restringen su incidencia real en los espacios de participación, limitando el reconocimiento social y el ejercicio pleno de sus derechos."},
{t:"i-dn",e:3,c:"4",code:"C.I.3.1",
 x:"Débil implementación y seguimiento de las rutas de atención frente a las violencias contra las personas mayores."},
{t:"i-dn",e:4,c:"5",code:"C.I.4.1",
 x:"Limitada capacidad para responder de manera oportuna a las necesidades de salud y cuidado en la vejez."},
{t:"i-dn",e:5,c:"6",code:"C.I.5.1",
 x:"Limitada capacidad de gobernanza y corresponsabilidad territorial para coordinar acciones entre actores públicos, privados, comunitarios y familiares en torno al envejecimiento y la vejez saludable."},
{t:"i-dn",e:6,c:"7 / span 2",code:"C.I.6.1",
 x:"Limitada priorización e incorporación del envejecimiento y la vejez en los procesos formativos, investigativos y de gestión del conocimiento."}
];

/* ============ RENDER ============ */
const RM = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const D = RM ? .001 : 1;
const board = document.getElementById("board");
const hueOf = n => EJES[n-1].hue;

function tierBlock(t){
  const sec = document.createElement("section");
  sec.className = "tier"; sec.dataset.tier = t.id;
  sec.innerHTML = `<div class="tier-head"><span class="rule"></span><span class="tier-name">${t.name}</span><span class="rule"></span></div><div class="grid"></div>`;
  const grid = sec.querySelector(".grid");
  const up = t.id.endsWith("dn");
  NODES.filter(n=>n.t===t.id).forEach(n=>{
    const cell = document.createElement("div");
    cell.className="cell"; cell.style.gridColumn=n.c;
    const link = `<div class="link"><i></i></div>`;
    const card = `<button class="card ${t.id.startsWith("d")?"direct":""}" style="--hue:${hueOf(n.e)}">
        <span class="code">${n.code}</span><span class="txt">${n.x}</span></button>`;
    cell.innerHTML = up ? link + card : card + link;
    const btn = cell.querySelector(".card");
    btn._node = n; n._el = btn;
    btn.addEventListener("click", ev=>{ ev.stopPropagation(); activate(n); });
    grid.appendChild(cell);
  });
  return sec;
}

board.appendChild(tierBlock(TIERS[0]));
board.appendChild(tierBlock(TIERS[1]));
const trunk = document.createElement("div");
trunk.className="trunk";
trunk.innerHTML = `<div class="tag"><span class="bar"></span><span>Problema central</span><span class="bar"></span></div><p>${CENTER}</p>`;
board.appendChild(trunk);
board.appendChild(tierBlock(TIERS[2]));
board.appendChild(tierBlock(TIERS[3]));

const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
svg.setAttribute("class","trace");
board.appendChild(svg);

/* ============ EMPAREJAMIENTO CAUSA ↔ EFECTO ============ */
const MIRROR = {"i-dn":"i-up","i-up":"i-dn","d-dn":"d-up","d-up":"d-dn"};
const suffix = code => code.replace(/^[A-Z]\.(?:[A-Z]\.)?/,"");

function partners(n){
  const pool = NODES.filter(m => m.t === MIRROR[n.t] && m.e === n.e);
  if(String(n.c).includes("span")) return pool;              // el nodo abarca todo el eje
  const exact = pool.filter(m => suffix(m.code) === suffix(n.code));
  return exact.length ? exact : pool;
}

/* ============ TRAZADO ============ */
let active = null;

function reset(){
  active = null;
  gsap.killTweensOf(svg.querySelectorAll("*"));
  svg.innerHTML = "";
  const old = board.querySelector(".closer");
  if(old) old.remove();
  document.querySelectorAll(".card").forEach(c=>{
    c.classList.remove("mute","on");
    gsap.set(c, {clearProps:"transform,scale"});
    gsap.set(c.querySelector(".code"), {clearProps:"opacity"});
  });
  trunk.classList.remove("faded");
}

function activate(n){
  if(active === n){ reset(); return; }
  reset();
  active = n;

  const mates = partners(n);
  const chosen = new Set([n._el, ...mates.map(m=>m._el)]);
  document.querySelectorAll(".card").forEach(c=>{ if(!chosen.has(c)) c.classList.add("mute"); });
  n._el.classList.add("on");
  trunk.classList.add("faded");

  requestAnimationFrame(()=>{                 // medir después de expandir el texto
    const base = board.getBoundingClientRect();
    svg.setAttribute("viewBox", `0 0 ${board.offsetWidth} ${board.offsetHeight}`);
    const isCause = n.t.endsWith("dn");
    const a = n._el.getBoundingClientRect();
    const x1 = a.left - base.left + a.width/2;
    const y1 = isCause ? a.top - base.top : a.bottom - base.top;

    /* X para salir, anclada a la esquina de la tarjeta que se pulsó */
    const closer = document.createElement("button");
    closer.className = "closer";
    closer.type = "button";
    closer.setAttribute("aria-label","Cerrar el trazado");
    closer.textContent = "✕";
    closer.style.left = (a.right - base.left - 13) + "px";
    closer.style.top  = (a.top   - base.top  - 13) + "px";
    closer.addEventListener("click", ev=>{ ev.stopPropagation(); reset(); });
    board.appendChild(closer);
    gsap.fromTo(closer,{scale:0,opacity:0},{scale:1,opacity:1,duration:.4*D,ease:"back.out(2.4)",delay:.15*D});

    mates.forEach((m,i)=>{
      const b = m._el.getBoundingClientRect();
      const x2 = b.left - base.left + b.width/2;
      const y2 = isCause ? b.bottom - base.top : b.top - base.top;
      const bend = Math.min(160, Math.abs(y2-y1)*.42);
      const d = `M ${x1} ${y1} C ${x1} ${y1 + (isCause?-bend:bend)}, ${x2} ${y2 + (isCause?bend:-bend)}, ${x2} ${y2}`;

      const path = document.createElementNS(svg.namespaceURI,"path");
      path.setAttribute("d", d); svg.appendChild(path);
      const len = path.getTotalLength();
      gsap.set(path,{strokeDasharray:len, strokeDashoffset:len, opacity:.9});

      const dot = document.createElementNS(svg.namespaceURI,"circle");
      dot.setAttribute("r","3.4"); svg.appendChild(dot);
      const p0 = path.getPointAtLength(0);
      dot.setAttribute("cx",p0.x); dot.setAttribute("cy",p0.y);

      const tl = gsap.timeline({delay:i*.12*D});
      tl.to(path,{strokeDashoffset:0, duration:.85*D, ease:"power2.inOut"},0)
        .to({t:0},{t:1, duration:.85*D, ease:"power2.inOut", onUpdate(){
            const p = path.getPointAtLength(this.targets()[0].t*len);
            dot.setAttribute("cx",p.x); dot.setAttribute("cy",p.y);
          }},0)
        .to(dot,{attr:{r:8}, opacity:0, duration:.45*D, ease:"power2.out"})
        .add(()=>{ m._el.classList.add("on"); },"-=0.35")
        .fromTo(m._el,{scale:1},{scale:1.035, duration:.22*D, yoyo:true, repeat:1, ease:"power2.out"},"-=0.3")
        .fromTo(m._el.querySelector(".code"),{opacity:.25},{opacity:1,duration:.4*D},"-=0.35");
    });
  });
}

document.addEventListener("click", e=>{ if(!e.target.closest(".card")) reset(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") reset(); });
window.addEventListener("resize", reset);

const cvsvg = document.createElementNS("http://www.w3.org/2000/svg","svg");
cvsvg.setAttribute("class","trace");
cvinner.appendChild(cvsvg);

/* ---- trazado de la cadena: recorre las cinco etapas del eje ---- */
let cvActive = null;

function cvReset(){
  cvActive = null;
  gsap.killTweensOf(cvsvg.querySelectorAll("*"));
  cvsvg.innerHTML = "";
  const old = cvinner.querySelector(".closer");
  if(old) old.remove();
  cvinner.querySelectorAll(".cveje").forEach(s=>s.classList.remove("mute"));
  cvinner.querySelectorAll(".cvbox").forEach(b=>{
    b.classList.remove("mute","on");
    gsap.set(b,{clearProps:"transform,scale"});
  });
  cvgen.classList.remove("mute");
}

function activarEje(e, sec){
  if(cvActive === e){ cvReset(); return; }
  cvReset();
  cvActive = e;

  cvinner.querySelectorAll(".cveje").forEach(s=>s.classList.toggle("mute", s !== sec));
  cvgen.classList.add("mute");
  const cajas = [...sec.querySelectorAll(".cvbox")];
  cajas[0].classList.add("on");

  requestAnimationFrame(()=>{
    const base = cvinner.getBoundingClientRect();
    cvsvg.setAttribute("viewBox", `0 0 ${cvinner.offsetWidth} ${cvinner.offsetHeight}`);

    const a0 = cajas[0].getBoundingClientRect();
    const closer = document.createElement("button");
    closer.className = "closer"; closer.type = "button";
    closer.setAttribute("aria-label","Cerrar el recorrido");
    closer.textContent = "✕";
    closer.style.left = (a0.right - base.left - 13) + "px";
    closer.style.top  = (a0.top   - base.top  - 13) + "px";
    closer.addEventListener("click", ev=>{ ev.stopPropagation(); cvReset(); });
    cvinner.appendChild(closer);
    gsap.fromTo(closer,{scale:0,opacity:0},{scale:1,opacity:1,duration:.4*D,ease:"back.out(2.4)",delay:.15*D});

    /* un tramo por cada paso de la cadena, encadenados */
    const maestra = gsap.timeline();
    for(let i=0;i<cajas.length-1;i++){
      const a = cajas[i].getBoundingClientRect();
      const b = cajas[i+1].getBoundingClientRect();
      const y  = Math.min(a.top,b.top) - base.top + Math.min(a.height,b.height)/2;
      const x1 = a.right - base.left + 1;
      const x2 = b.left  - base.left - 1;
      const mid = (x1+x2)/2;
      const d = `M ${x1} ${y} C ${mid} ${y}, ${mid} ${y}, ${x2} ${y}`;

      const path = document.createElementNS(cvsvg.namespaceURI,"path");
      path.setAttribute("d", d); cvsvg.appendChild(path);
      const len = path.getTotalLength();
      gsap.set(path,{strokeDasharray:len, strokeDashoffset:len, opacity:.9});

      const dot = document.createElementNS(cvsvg.namespaceURI,"circle");
      dot.setAttribute("r","3.4"); cvsvg.appendChild(dot);
      const p0 = path.getPointAtLength(0);
      dot.setAttribute("cx",p0.x); dot.setAttribute("cy",p0.y);

      const destino = cajas[i+1];
      const tramo = gsap.timeline();
      tramo.to(path,{strokeDashoffset:0, duration:.55*D, ease:"power2.inOut"},0)
           .to({t:0},{t:1, duration:.55*D, ease:"power2.inOut", onUpdate(){
              const p = path.getPointAtLength(this.targets()[0].t*len);
              dot.setAttribute("cx",p.x); dot.setAttribute("cy",p.y);
            }},0)
           .to(dot,{attr:{r:7}, opacity:0, duration:.3*D, ease:"power2.out"})
           .add(()=>{ destino.classList.add("on"); },"-=0.24")
           .fromTo(destino,{scale:1},{scale:1.03, duration:.19*D, yoyo:true, repeat:1, ease:"power2.out"},"-=0.22");
      maestra.add(tramo, i===0 ? 0 : ">-0.12");
    }
  });
}

/* ============ PESTAÑAS ============ */
let vista = "tree";
const vTabs = [...document.querySelectorAll("#views button")];
const vline = document.getElementById("vline");
const treeview = document.getElementById("treeview");
const chainview = document.getElementById("chainview");

function ubicarLinea(){
  const b = vTabs.find(x=>x.getAttribute("aria-selected")==="true");
  gsap.set(vline,{width:b.offsetWidth, x:b.offsetLeft});
}

vTabs.forEach(b=>b.addEventListener("click", ()=>{
  if(b.dataset.view === vista) return;
  vista = b.dataset.view;
  reset(); cvReset();
  vTabs.forEach(x=>x.setAttribute("aria-selected", String(x.dataset.view===vista)));
  gsap.to(vline,{width:b.offsetWidth, x:b.offsetLeft, duration:.45*D, ease:"power3.inOut"});

  const sale  = vista==="tree" ? chainview : treeview;
  const entra = vista==="tree" ? treeview  : chainview;
  gsap.to(sale,{opacity:0, y:-10, duration:.25*D, ease:"power2.in", onComplete(){
    sale.style.display="none";
    entra.style.display="block";
    gsap.fromTo(entra,{opacity:0,y:14},{opacity:1,y:0,duration:.45*D,ease:"power3.out",
      clearProps:"transform,opacity"});
    if(vista==="chain" && !chainview._visto){
      chainview._visto = true;
      const piezas = [cvgen, ...cvhead.children, ...cvinner.querySelectorAll(".cveje")];
      gsap.set(piezas,{y:16,opacity:0});
      const tlcv = gsap.to(piezas,{y:0,opacity:1,duration:.5*D,stagger:.05*D,ease:"power3.out",
        clearProps:"transform,opacity"});
      setTimeout(()=>{ if(tlcv.progress()<1) tlcv.progress(1); }, 4000);
    }
  }});
}));

window.addEventListener("resize", ()=>{ ubicarLinea(); cvReset(); });
document.addEventListener("click", e=>{ if(!e.target.closest(".cvbox")) cvReset(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") cvReset(); });

  gsap.set(".trunk",         {opacity:0, scaleX:.95});
  gsap.set(".trunk p",       {y:18, opacity:0});
  gsap.set(".trunk .bar",    {scaleX:0});

  ubicarLinea();

  const tl = gsap.timeline({
    defaults:{ease:"power3.out"},
    /* al terminar se borran todos los estilos en línea: nada queda colgado
       y el transform del :hover de CSS vuelve a funcionar */
    onComplete(){ gsap.set(TODO, {clearProps:"all"}); }
  });

  tl.to(".eyebrow-title", {y:0, opacity:1, duration:.55})
    .to("header hr",      {scaleX:1, duration:.5}, "-=0.25")
    .to(".main-title",    {y:0, opacity:1, duration:.7}, "-=0.3")
    .to(".tier-head",     {opacity:1, duration:.4, stagger:.05}, "-=0.3")
    .to(".tier[data-tier='i-up'] .card", {y:0, opacity:1, duration:.5, stagger:.04}, "-=0.25")
    .to(".tier[data-tier='d-up'] .card", {y:0, opacity:1, duration:.5, stagger:.04}, "-=0.35")
    .to(LNKU,             {scaleY:1, duration:.4, stagger:.03}, "-=0.5")
    .to(".trunk",         {opacity:1, scaleX:1, duration:.6}, "-=0.25")
    .to(".trunk .bar",    {scaleX:1, duration:.7}, "-=0.45")
    .to(".trunk p",       {y:0, opacity:1, duration:.6}, "-=0.6")
    .to(".tier[data-tier='d-dn'] .card", {y:0, opacity:1, duration:.5, stagger:.04}, "-=0.45")
    .to(".tier[data-tier='i-dn'] .card", {y:0, opacity:1, duration:.5, stagger:.04}, "-=0.35")
    .to(LNKD,             {scaleY:1, duration:.4, stagger:.03}, "-=0.5")
    .to(".date-line",     {y:0, opacity:1, duration:.5}, "-=1.6")
    .to("#views",         {opacity:1, y:0, duration:.5}, "-=1.5");

  /* red de seguridad: pase lo que pase, a los 6 s todo queda visible */
  setTimeout(()=>{ if(tl.progress() < 1){ tl.progress(1); } }, 6000);
}

if(document.readyState === "complete") entrada();
else window.addEventListener("load", entrada);
</script>
</body>
</html>
